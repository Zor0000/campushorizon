{% load event_filters %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CampusHorizon{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #0A0A0B; }
        .card-hover:hover { border-color: rgba(255,255,255,0.15); box-shadow: 0 0 30px rgba(255,255,255,0.03); }
        .glow-hover:hover { box-shadow: 0 0 40px rgba(99, 102, 241, 0.08); }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        main { animation: fadeSlideIn 0.35s ease-out; }
        .stagger-item { opacity: 0; animation: fadeSlideIn 0.4s ease-out forwards; }
        .htmx-indicator { opacity: 0; transition: opacity 0.2s; }
        .htmx-request .htmx-indicator { opacity: 1; }
        .htmx-request.htmx-indicator { opacity: 1; }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body class="min-h-screen text-white antialiased flex flex-col justify-between">
    <nav class="border-b border-white/5 bg-[#0A0A0B]/80 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="{% url 'events:landing' %}" class="flex items-center gap-2.5 group">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition-transform">
                    <span class="text-white font-bold text-sm">CH</span>
                </div>
                <span class="font-semibold text-white/90 group-hover:text-white transition-colors">CampusHorizon</span>
            </a>
            <div class="flex items-center gap-2">
                <a href="{% url 'events:hackathons' %}" class="px-3.5 py-1.5 rounded-xl text-sm transition-all {% if request.resolver_match.url_name == 'hackathons' %}bg-white/10 text-white font-medium border border-white/10 shadow-sm{% else %}text-white/50 hover:text-white/90 hover:bg-white/[0.04]{% endif %}">
                    Hackathons
                </a>
                <a href="{% url 'events:tech_events' %}" class="px-3.5 py-1.5 rounded-xl text-sm transition-all {% if request.resolver_match.url_name == 'tech_events' %}bg-white/10 text-white font-medium border border-white/10 shadow-sm{% else %}text-white/50 hover:text-white/90 hover:bg-white/[0.04]{% endif %}">
                    Tech Events
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-white/5 mt-24 bg-white/[0.01]">
        <div class="max-w-6xl mx-auto px-6 py-10 flex flex-col md:flex-row items-center justify-between gap-6 text-sm text-white/40">
            <div class="flex items-center gap-3">
                <div class="w-6 h-6 rounded-md bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-xs text-white font-bold">
                    CH
                </div>
                <span>CampusHorizon &mdash; Self-healing event aggregator for students</span>
            </div>
            <div class="flex items-center gap-4 text-xs text-white/40">
                <span class="inline-flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    Live feeds active
                </span>
                <span>&middot;</span>
                <span>Powered by Bright Data</span>
            </div>
        </div>
    </footer>
</body>
</html>
